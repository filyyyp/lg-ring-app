# Vlož do YAML editora jednej novej automatizácie. Nahraď entity a MAC.
alias: LG Ring – zvonček na TV
description: Zobudí LG TV a po zvonení ju vypne, iba ak bola pôvodne vypnutá.
variables:
  tv_entity: media_player.lg_tv
  tv_mac: "AA:BB:CC:DD:EE:FF"
  # unavailable pridaj iba ak si overil, že ho TV hlási po vypnutí.
  tv_off_states: ["off"]
triggers:
  - trigger: state
    entity_id: binary_sensor.doorbell
    from: "off"
    to: "on"
conditions: []
actions:
  - variables:
      initial_tv_state: "{{ states(tv_entity) }}"
  - variables:
      tv_was_off: "{{ initial_tv_state in tv_off_states }}"
  - condition: template
    value_template: "{{ tv_was_off or initial_tv_state in ['on', 'idle', 'playing', 'paused'] }}"
  - if:
      - condition: template
        value_template: "{{ tv_was_off }}"
    then:
      - action: wake_on_lan.send_magic_packet
        data:
          mac: "{{ tv_mac }}"
      - wait_template: "{{ states(tv_entity) in ['on', 'idle', 'playing', 'paused'] }}"
        timeout: "00:00:30"
        continue_on_timeout: false
      - delay: "00:00:02"
  - action: webostv.command
    continue_on_error: true
    target:
      entity_id: "{{ tv_entity }}"
    data:
      command: system.launcher/launch
      payload:
        id: sk.filip.doorbell
        params:
          action: doorbell
          duration: 15
          volume: 0.7
          message: "Pozri sa, kto prišiel na návštevu."
          label: "VCHODOVÉ DVERE"
          # camera: "http://192.168.1.50:8080/doorbell.m3u8"
          # cameraType: video
  - delay: "00:00:20"
  - if:
      - condition: template
        value_template: "{{ tv_was_off }}"
    then:
      - action: media_player.turn_off
        target:
          entity_id: "{{ tv_entity }}"
# Ignoruje opakovane zazvonenie pocas sekvencie, aby sa zachoval povodny stav.
mode: single
max_exceeded: silent
